{{- if eq (include "aap-config.manifestCsiEnabled" .) "true" }}
{{- $sc := index .Subcharts "openshift-sscsi-vault" }}
{{- if not $sc }}
{{- fail "aapManifest.csi.enabled requires the openshift-sscsi-vault chart dependency (run helm dependency update)." }}
{{- end }}
{{- $scg := default dict $sc.Values.clusterGroup }}
{{- $pcg := default dict $.Values.clusterGroup }}
{{- $cg := mergeOverwrite $scg $pcg }}
{{- $sapps := default dict $scg.applications }}
{{- $papps := default dict $pcg.applications }}
{{- $_ := set $cg "applications" (mergeOverwrite $sapps $papps) }}
{{- $parentVault := default dict (index $.Values "openshift-sscsi-vault") }}
{{- $id := $.Values.csiWorkloadIdentity | default dict }}
{{- $ociPatch := dict }}
{{- if and $id (eq true (default false $id.enabled)) }}
{{- $sa := required "csiWorkloadIdentity.serviceAccount is required when csiWorkloadIdentity.enabled" $id.serviceAccount }}
{{- $ns := required "csiWorkloadIdentity.namespace is required when csiWorkloadIdentity.enabled" $id.namespace }}
{{- $mount := default "hub" $id.vaultAuthMount }}
{{- $app := default "aap-config" $id.appKey }}
{{- $explicit := $id.vaultKubernetesAuthRole | default "" | trim }}
{{- $slug := include "aap-config.vaultSscsiSlug" (dict "ns" $ns "sa" $sa "app" $app) }}
{{- $computed := printf "%s-sscsi-%s" $mount $slug }}
{{- $role := ternary $explicit $computed (ne $explicit "") }}
{{- $rbac := dict "rolename" $role "serviceAccount" (dict "create" false "name" $sa "namespace" $ns) }}
{{- $oci := dict "rbac" $rbac }}
{{- $baseTls := $sc.Values.ocpSecretsStoreCsiVault.tls | default dict }}
{{- $pv := index $parentVault "ocpSecretsStoreCsiVault" | default dict }}
{{- $parentTls := mergeOverwrite (deepCopy $baseTls) (deepCopy ($pv.tls | default dict)) }}
{{- $tls := deepCopy $parentTls }}
{{- if hasKey $id "vaultSkipTLSVerify" }}
{{- $tls = mergeOverwrite $tls (dict "vaultSkipTLSVerify" (trim (include "aap-config.normalizeVaultSkipTLSVerify" (dict "v" (index $id "vaultSkipTLSVerify"))))) }}
{{- end }}
{{- $cap := $id.vaultCACertPath | default "" | toString | trim }}
{{- if gt (len $cap) 0 }}
{{- $tls = mergeOverwrite $tls (dict "vaultCACertPath" $cap) }}
{{- end }}
{{- $vsn := $id.vaultTLSServerName | default "" | toString | trim }}
{{- if gt (len $vsn) 0 }}
{{- $tls = mergeOverwrite $tls (dict "vaultTLSServerName" $vsn) }}
{{- end }}
{{- $_ := set $oci "tls" $tls }}
{{- $ociPatch = dict "ocpSecretsStoreCsiVault" $oci }}
{{- end }}
{{- $vaultVals := mergeOverwrite $sc.Values $parentVault (dict "clusterGroup" $cg) $ociPatch }}
{{- $ociVault := index $vaultVals "ocpSecretsStoreCsiVault" | default dict }}
{{- $ociTls := $ociVault.tls | default dict }}
{{- $nSkip := trim (include "aap-config.normalizeVaultSkipTLSVerify" (dict "v" (index $ociTls "vaultSkipTLSVerify"))) }}
{{- $ociTlsN := mergeOverwrite $ociTls (dict "vaultSkipTLSVerify" $nSkip) }}
{{- $vaultVals := mergeOverwrite $vaultVals (dict "ocpSecretsStoreCsiVault" (mergeOverwrite $ociVault (dict "tls" $ociTlsN))) }}
{{- $vaultCtx := dict "Chart" $sc.Chart "Capabilities" $sc.Capabilities "Release" $sc.Release "Values" $vaultVals }}
{{- $pem := trim (include "aap_config.vaultTlsCaPemFromCluster" $vaultCtx) }}
{{- if ne $pem "" }}
{{- $ociVault2 := index $vaultVals "ocpSecretsStoreCsiVault" | default dict }}
{{- $caProv := $ociVault2.caProvider | default dict }}
{{- $capSync := $caProv.syncProviderCaConfigMap | default dict }}
{{- $mountDir := $capSync.mountDir | default "/etc/pki/vault-ca" | trim }}
{{- $keyFile := $capSync.keyInConfigMap | default "vault-tls-ca.pem" | trim }}
{{- $caPath := printf "%s/%s" $mountDir $keyFile }}
{{- $ociTls2 := mergeOverwrite ($ociVault2.tls | default dict) (dict "vaultCACertPath" $caPath) }}
{{- $vaultVals = mergeOverwrite $vaultVals (dict "ocpSecretsStoreCsiVault" (mergeOverwrite $ociVault2 (dict "tls" $ociTls2))) }}
{{- $vaultCtx = dict "Chart" $sc.Chart "Capabilities" $sc.Capabilities "Release" $sc.Release "Values" $vaultVals }}
{{- end }}
{{- $caYaml := include "aap_config.syncVaultCsiTlsCaConfigMapYaml" $vaultCtx | trim }}
{{- if $caYaml }}
{{ $caYaml }}
---
{{- end }}
{{- include "openshift_sscsi_vault.secretproviderclass" $vaultCtx }}
---
{{- include "openshift_sscsi_vault.workload_rbac" $vaultCtx }}
{{- end }}
