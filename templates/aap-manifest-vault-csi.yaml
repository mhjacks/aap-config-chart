{{- if eq (include "aap-config.manifestCsiEnabled" $) "true" }}
{{- if not (index .Subcharts "vp-sscsi-spc") }}
{{- fail "aapManifest.csi.enabled requires the vp-sscsi-spc chart dependency (run helm dependency update)." }}
{{- end }}
{{- $vals := deepCopy $.Values }}
{{- $id := $.Values.csiWorkloadIdentity | default dict }}
{{- if and $id (eq true (default false $id.enabled)) }}
{{- $sa := required "csiWorkloadIdentity.serviceAccount is required when csiWorkloadIdentity.enabled" $id.serviceAccount }}
{{- $ns := required "csiWorkloadIdentity.namespace is required when csiWorkloadIdentity.enabled" $id.namespace }}
{{- $mount := default "hub" $id.vaultAuthMount }}
{{- $app := default "aap-config" $id.appKey }}
{{- $explicit := $id.vaultKubernetesAuthRole | default "" | trim }}
{{- $slug := include "aap-config.vaultSscsiSlug" (dict "ns" $ns "sa" $sa "app" $app) }}
{{- $appKey := (index $vals "ocpSecretsStoreCsiVault" | default dict).applicationKey | default "aap-config" | trim }}
{{- $cg := deepCopy ($vals.clusterGroup | default dict) }}
{{- $apps := deepCopy ($cg.applications | default dict) }}
{{- $appEntry := deepCopy (index $apps $appKey | default dict) }}
{{- $entry := dict "serviceAccount" $sa "namespace" $ns "cluster" $mount }}
{{- if ne $explicit "" }}
{{- $_ := set $entry "roleName" $explicit }}
{{- else }}
{{- $_ := set $entry "roleSlug" $slug }}
{{- end }}
{{- $_ := set $appEntry "ssCsiWorkloadAuth" (list $entry) }}
{{- $_ := set $apps $appKey $appEntry }}
{{- $_ := set $cg "applications" $apps }}
{{- $_ := set $vals "clusterGroup" $cg }}
{{- $oci := index $vals "ocpSecretsStoreCsiVault" | default dict }}
{{- $tls := deepCopy ($oci.tls | default dict) }}
{{- if hasKey $id "vaultSkipTLSVerify" }}
{{- $tls = mergeOverwrite $tls (dict "vaultSkipTLSVerify" (trim (include "aap-config.normalizeVaultSkipTLSVerify" (dict "v" (index $id "vaultSkipTLSVerify"))))) }}
{{- end }}
{{- $cap := $id.vaultCACertPath | default "" | toString | trim }}
{{- if gt (len $cap) 0 }}
{{- $tls = mergeOverwrite $tls (dict "vaultCACertPath" $cap) }}
{{- end }}
{{- $vsn := $id.vaultTLSServerName | default "" | toString | trim }}
{{- if gt (len $vsn) 0 }}
{{- $tls = mergeOverwrite $tls (dict "vaultTLSServerName" $vsn) }}
{{- end }}
{{- $_ := set $vals "ocpSecretsStoreCsiVault" (mergeOverwrite $oci (dict "tls" $tls)) }}
{{- end }}
{{- $oci := index $vals "ocpSecretsStoreCsiVault" | default dict }}
{{- $tls := $oci.tls | default dict }}
{{- $nSkip := trim (include "aap-config.normalizeVaultSkipTLSVerify" (dict "v" (index $tls "vaultSkipTLSVerify"))) }}
{{- $_ := set $vals "ocpSecretsStoreCsiVault" (mergeOverwrite $oci (dict "tls" (mergeOverwrite $tls (dict "vaultSkipTLSVerify" $nSkip)))) }}
{{- if and ($vals.ocpSecretsStoreCsiVault.secretProviderClass | default dict).installDefaultManifests }}
{{- $ctx := dict "Chart" .Chart "Capabilities" .Capabilities "Release" .Release "Template" .Template "Values" $vals }}
{{- $spc := include "vp_sscsi_spc.secretproviderclass" $ctx | trim }}
{{- if $spc }}
---
{{ $spc }}
{{- end }}
{{- end }}
{{- end }}
