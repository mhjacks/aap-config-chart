{{- if not $.Values.validationJob.disabled }}
---
apiVersion: batch/v1
kind: Job
metadata:
  name: external-secrets-validation-job
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  parallelism: 1
  completions: 1
  backoffLimit: 3
  activeDeadlineSeconds: {{ $.Values.validationJob.activeDeadlineSeconds }}
  template:
    spec:
      restartPolicy: Never
      serviceAccountName: {{ $.Values.serviceAccountName }}
      containers:
      - name: secrets-validator
        image: {{ .Values.configJob.image }}
        imagePullPolicy: {{ $.Values.configJob.imagePullPolicy }}
        command:
        - /bin/bash
        - -c
        - |
          set -euo pipefail

          echo "Starting external secrets validation..."

          NS="{{ default .Release.Namespace .Values.validationJob.externalSecretsNamespace }}"

          # Discover ExternalSecret resource names in the target namespace
          refresh_external_secret_names() {
            kubectl get externalsecret -n "$NS" -o jsonpath='{range .items[*]}{.metadata.name}{"\n"}{end}' 2>/dev/null || true
          }

          target_secret_for_es() {
            local es_name=$1
            local tn
            tn=$(kubectl get externalsecret -n "$NS" "$es_name" -o jsonpath='{.spec.target.name}' 2>/dev/null || true)
            if [ -z "$tn" ]; then
              printf '%s' "$es_name"
            else
              printf '%s' "$tn"
            fi
          }

          # Function to check if a secret exists and has data
          check_secret() {
            local secret_name=$1
            echo "Checking secret: $secret_name"

            # Check if secret exists
            if ! kubectl get secret "$secret_name" -n "$NS" >/dev/null 2>&1; then
              echo "ERROR: Secret $secret_name does not exist"
              return 1
            fi

            # Check if secret has data
            local data_count=$(kubectl get secret "$secret_name" -n "$NS" -o jsonpath='{.data}' | jq -r 'length')
            if [ "$data_count" -eq 0 ]; then
              echo "ERROR: Secret $secret_name exists but has no data"
              return 1
            fi

            echo "SUCCESS: Secret $secret_name is populated with $data_count data field(s)"
            return 0
          }

          # Function to check external secret status
          check_external_secret_status() {
            local external_secret_name=$1
            echo "Checking ExternalSecret status: $external_secret_name"

            # Check if ExternalSecret exists
            if ! kubectl get externalsecret "$external_secret_name" -n "$NS" >/dev/null 2>&1; then
              echo "ERROR: ExternalSecret $external_secret_name does not exist"
              return 1
            fi

            # Check ExternalSecret status
            local ready_status=$(kubectl get externalsecret "$external_secret_name" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Ready")].status}')
            if [ "$ready_status" != "True" ]; then
              echo "ERROR: ExternalSecret $external_secret_name is not ready. Status: $ready_status"
              # Get more details about the error
              kubectl get externalsecret "$external_secret_name" -n "$NS" -o jsonpath='{.status.conditions[?(@.type=="Ready")].message}' | xargs -I {} echo "Message: {}"
              return 1
            fi

            echo "SUCCESS: ExternalSecret $external_secret_name is ready"
            return 0
          }

          # Wait and validate all external secrets in a loop until all are healthy
          echo "Starting validation loop for external secrets..."
          TIMEOUT={{ .Values.validationJob.activeDeadlineSeconds }}
          START_TIME=$(date +%s)
          WAIT_INTERVAL=10

          while true; do
            CURRENT_TIME=$(date +%s)
            ELAPSED=$((CURRENT_TIME - START_TIME))

            if [ $ELAPSED -ge $TIMEOUT ]; then
              echo "ERROR: Timeout ($TIMEOUT seconds) reached waiting for external secrets to be healthy in namespace $NS"
              mapfile -t _final_list < <(refresh_external_secret_names)
              if [ "${#_final_list[@]}" -eq 0 ]; then
                echo "ERROR: No ExternalSecrets found in namespace $NS (at least one is required)"
              fi
              exit 1
            fi

            echo "=== Validation attempt (${ELAPSED}s/${TIMEOUT}s) ==="

            mapfile -t EXTERNAL_SECRETS < <(refresh_external_secret_names)

            if [ "${#EXTERNAL_SECRETS[@]}" -eq 0 ]; then
              echo "⚠️  No ExternalSecrets found in namespace $NS (at least one is required)"
              all_healthy=false
            else
              all_healthy=true
            fi

            if [ "$all_healthy" = true ]; then
              for es_name in "${EXTERNAL_SECRETS[@]}"; do
                [ -z "$es_name" ] && continue
                echo "Checking $es_name..."
                secret_name=$(target_secret_for_es "$es_name")

                if ! check_external_secret_status "$es_name" >/dev/null 2>&1; then
                  echo "⚠️  ExternalSecret $es_name is not ready yet"
                  all_healthy=false
                  continue
                fi

                if ! check_secret "$secret_name" >/dev/null 2>&1; then
                  echo "⚠️  Secret $secret_name (target of $es_name) is not populated yet"
                  all_healthy=false
                  continue
                fi

                echo "✅ $es_name is healthy (secret: $secret_name)"
              done
            fi

            if [ "$all_healthy" = true ]; then
              echo ""
              echo "🎉 SUCCESS: All external secrets are healthy!"
              break
            fi

            echo ""
            echo "⏳ Waiting ${WAIT_INTERVAL} seconds before next check..."
            sleep $WAIT_INTERVAL
          done

          echo ""
          echo "=== FINAL VALIDATION SUMMARY ==="
          mapfile -t EXTERNAL_SECRETS < <(refresh_external_secret_names)
          for es_name in "${EXTERNAL_SECRETS[@]}"; do
            [ -z "$es_name" ] && continue
            secret_name=$(target_secret_for_es "$es_name")
            echo "✅ $es_name: ExternalSecret ready and Secret $secret_name populated"
          done
        resources:
          requests:
            memory: "64Mi"
            cpu: "100m"
          limits:
            memory: "128Mi"
            cpu: "200m"
{{- end }}{{/* if not $.Values.validationJob.disabled */}}
