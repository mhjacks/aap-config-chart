---
apiVersion: v2
description: A Helm chart to build and deploy secrets using external-secrets for ansible-edge-gitops
home: https://github.com/validatedpatterns/aap-config-chart.git
keywords:
- pattern
name: aap-config
version: 0.2.11
dependencies:
- name: vp-rbac
  version: '0.1.*'
  repository: https://charts.validatedpatterns.io
# openshift-sscsi-vault: 0.0.12+ CA sync; 0.0.13+ pemLiteral/useLookup; 0.0.15+ CNO inject-trusted-cabundle;
# 0.0.16+ Argo ignore-differences on injected CA ConfigMap. `0.0.*` picks latest once `helm dependency update`.
- name: openshift-sscsi-vault
  version: '0.0.*'
  repository: https://charts.validatedpatterns.io
  condition: aapManifest.csi.enabled
