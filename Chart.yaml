---
apiVersion: v2
description: A Helm chart to build and deploy secrets using external-secrets for ansible-edge-gitops
home: https://github.com/validatedpatterns/aap-config-chart.git
keywords:
- pattern
name: aap-config
version: 0.3.1
dependencies:
- name: vp-rbac
  version: '0.1.*'
  repository: https://charts.validatedpatterns.io
# vp-sscsi-spc: renders SecretProviderClass from the dependency when CSI is enabled (installDefaultManifests).
# Root ocpSecretsStoreCsiVault / clusterGroup must be mirrored under vp-sscsi-spc in values (Helm subchart scope).
- name: vp-sscsi-spc
  version: '0.1.*'
  repository: https://charts.validatedpatterns.io
  condition: aapManifest.csi.enabled
