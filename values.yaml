---
secretStore:
  name: vault-backend
  kind: ClusterSecretStore

aapManifest:
  # How the AAP manifest reaches the config job pod (always mounted).
  # - sscsi: Secrets Store CSI volume (default)
  # - externalSecret: native Secret volume (chart-managed ExternalSecret and/or your own Secret)
  source: sscsi
  key: secret/data/hub/aap-manifest
  # When source is externalSecret, set false if you already manage ExternalSecret/Secret elsewhere.
  createExternalSecret: true
  sscsi:
    driver: secrets-store.csi.k8s.io
    secretProviderClass: aap-manifest
    mountPath: /pattern-home/aap-manifest
  externalSecret:
    secretName: aap-manifest
    mountPath: /pattern-home/aap-manifest

agof:
  vaultFileKey: secret/data/hub/agof-vault-file
  vaultFileEnabled: true
  automationHubTokenKey: secret/data/hub/automation-hub-token
  extraPlaybookOpts: ''

  agof_repo: https://github.com/validatedpatterns/agof.git
  agof_revision: v2

  iac_repo: https://github.com/validatedpatterns-demos/ansible-edge-gitops-hmi-config-as-code.git
  iac_revision: main

configJob:
  image: quay.io/hybridcloudpatterns/imperative-container:v1
  schedule: "10 */2 * * *"
  activeDeadlineSeconds: 3600
  imagePullPolicy: Always
  configTimeout: 1800

serviceAccountName: aap-config-sa
serviceAccountNamespace: aap-config

# Validation job configuration
validationJob:
  disabled: false
  activeDeadlineSeconds: 3600
  # Namespace to list ExternalSecrets from (unset = Helm release namespace)
  externalSecretsNamespace: ""

# RBAC configuration using vp-rbac subchart
vp-rbac:
  serviceAccounts:
    aap-config-sa:
      namespace: aap-config
      roleBindings:
        roles:
          - view-all
          - external-secrets-validator
        clusterRoles:
          - view-secrets-cms
          - view-routes

  clusterRoles:
    view-secrets-cms:
      rules:
      - apiGroups: [""]
        resources: ["secrets", "configmaps"]
        verbs: ["get", "list", "watch"]

    view-routes:
      rules:
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        verbs: ["get", "list", "watch"]

  roles:
    view-all:
      rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

    # RBAC for external secrets validation (namespace-scoped)
    external-secrets-validator:
      rules:
      - apiGroups: ["external-secrets.io"]
        resources: ["externalsecrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["authorization.k8s.io"]
        resources: ["selfsubjectrulesreviews"]
        verbs: ["create"]
