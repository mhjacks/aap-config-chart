---
secretStore:
  name: vault-backend
  kind: ClusterSecretStore

aapManifest:
  key: secret/data/hub/aap-manifest
  # When enabled: no ExternalSecret for aap-manifest; Vault CSI mounts the manifest instead.
  # Requires vp-sscsi-spc dependency, cluster **openshift-sscsi-vault** app for provider TLS/RBAC,
  # and pattern `clusterGroup.applications[applicationKey].ssCsiWorkloadAuth` (or csiWorkloadIdentity).
  csi:
    enabled: false
    mountPath: /pattern-home/aap-manifest
    objectName: b64content
    secretProviderClassName: aap-manifest-vault
    # When CSI manifest is used and Vault TLS verification is on (SPC vaultSkipTLSVerify not true),
    # run an init container before agof-init that probes Vault HTTPS (same URL as the SPC) so TLS
    # failures surface before git clone. Uses configJob.image; override caBundlePath if your image
    # stores trust elsewhere.
    vaultTlsCheck:
      enabled: true
      caBundlePath: /etc/pki/tls/certs/ca-bundle.crt
      connectTimeoutSeconds: 10
      maxTimeSeconds: 60

agof:
  doAutoHubVaultConfig: true
  # When non-empty: ExternalSecret agof-vault-file + mount for agof overlay secrets.
  # Set to "" to skip Vault-backed agof vault file (init writes a minimal empty ~/agof_vault.yml).
  # Set to "secret/data/hub/agof-vault-file to use one if you need it
  vaultFileKey: ""
  automationHubTokenKey: secret/data/hub/automation-hub-token
  extraPlaybookOpts: ''

  agof_repo: https://github.com/validatedpatterns/agof.git
  agof_revision: v2
  # Optional: name of an existing Secret (same namespace) whose keys are mounted for
  # git in the agof-init container (clone agof_repo) and the agof-config container
  # (e.g. clone/fetch iac_repo during make). Use one of:
  # - .git-credentials: full git-credential-store line(s) for HTTPS
  # - ssh-privatekey (+ optional known_hosts): SSH private key (e.g. kubernetes.io/ssh-auth)
  # - HTTPS: username + (password or token), or token-only with gitAuthHttpsStyle below
  gitAuthSecret: ''
  # Optional Vault path: when set (with gitAuthSecret), an ExternalSecret is created that uses
  # dataFrom.extract to copy all fields from that Vault secret into the Kubernetes Secret named
  # gitAuthSecret (same pattern as vaultFileKey / agof-vault-file).
  gitAuthVaultKey: ''
  # When the Secret has only a "token" key: how to pick the HTTPS username (PAT / OAuth).
  # auto: from each repo URL host (github.com -> git; gitlab / gitea / forgejo / codeberg -> oauth2)
  # github|gitlab|gitea: force that platform's usual clone user (git / oauth2 / oauth2)
  gitAuthHttpsStyle: auto

  iac_repo: https://github.com/validatedpatterns-demos/ansible-edge-gitops-hmi-config-as-code.git
  iac_revision: main

configJob:
  image: quay.io/hybridcloudpatterns/imperative-container:v1
  schedule: "10 */2 * * *"
  activeDeadlineSeconds: 3600
  imagePullPolicy: Always
  configTimeout: 1800

serviceAccountName: aap-config-sa
serviceAccountNamespace: aap-config

# Single block for Vault CSI workload identity (SA, namespace, Vault Kubernetes auth role).
# When enabled, templates synthesize clusterGroup.applications[ocpSecretsStoreCsiVault.applicationKey].ssCsiWorkloadAuth
# for the SecretProviderClass and drive workload pods' serviceAccountName from the same fields.
csiWorkloadIdentity:
  enabled: false
  serviceAccount: ""
  namespace: ""
  vaultAuthMount: hub
  appKey: aap-config
  # If set, used as the full Vault role name for SecretProviderClass (e.g. hub-sscsi-<sha1> when
  # rhvp.cluster_utils uses hash mode). If empty, role is {{ vaultAuthMount }}-sscsi-<stable slug>
  # matching vault_ss_csi_role_slug_mode: stable_slug in rhvp.cluster_utils.
  vaultKubernetesAuthRole: ""
  # Optional (non-empty only): tls.vaultSkipTLSVerify ("true"/"false"), vaultCACertPath, vaultTLSServerName
  # merged into ocpSecretsStoreCsiVault for the SPC. Omit vaultSkipTLSVerify here to inherit values below.

# App SecretProviderClass (vp-sscsi-spc). Namespace, Vault role, and SA name resolve from
# clusterGroup.applications[applicationKey].ssCsiWorkloadAuth[workloadAuthIndex] when the pattern supplies it.
# Default applicationKey is **aap-config** so ssCsiWorkloadAuth lives with this chart's Argo application
# (unlike config-demo, which hangs auth under openshift-sscsi-vault). Override applicationKey if your pattern uses another key.
# Cluster chart openshift-sscsi-vault (vault ns) still supplies TLS CA ConfigMap sync for the CSI provider and token-review RBAC.
ocpSecretsStoreCsiVault:
  applicationKey: aap-config
  workloadAuthIndex: 0
  secretProviderClass:
    installDefaultManifests: false
    enabled: true
    name: aap-manifest-vault
    namespace: aap-config
  auth:
    roleName: hub-role
  objects:
    - objectName: b64content
      secretPath: secret/data/hub/aap-manifest
      secretKey: b64content
  secretObjects: []
  vault:
    externalAddress: ""
    hubMountPath: hub
  tls:
    vaultSkipTLSVerify: "false"
    # Non-empty wins over projectedClusterCa. Align with openshift-sscsi-vault sync mount on the CSI provider pod.
    vaultCACertPath: ""
    vaultTLSServerName: ""
    # When enabled and vaultCACertPath is empty, SPC vaultCACertPath matches openshift-sscsi-vault defaults (CNO bundle path).
    projectedClusterCa:
      enabled: true
      mountDir: "/etc/pki/vault-ca"
      injectTrustedCabundle: true
      trustedCabundleDataKey: "ca-bundle.crt"
      keyInConfigMap: "vault-tls-ca.pem"
global:
  hubClusterDomain: hub.example.com
  clusterDomain: foo.example.com
  localClusterDomain: ""
clusterGroup: &aapClusterGroup
  applications: {}

# Subchart vp-sscsi-spc: dependency supplies library templates; SecretProviderClass is rendered by the parent
# (templates/aap-manifest-vault-csi.yaml) so csiWorkloadIdentity merges apply. Keep installDefaultManifests false
# to avoid duplicate SPCs. Mirror clusterGroup for consistency (Helm does not pass parent-only keys into subcharts).
vp-sscsi-spc:
  clusterGroup: *aapClusterGroup
  ocpSecretsStoreCsiVault:
    secretProviderClass:
      enabled: false
      installDefaultManifests: false
validationJob:
  disabled: false
  activeDeadlineSeconds: 3600

# RBAC configuration using vp-rbac subchart
vp-rbac:
  serviceAccounts:
    aap-config-sa:
      namespace: aap-config
      roleBindings:
        roles:
          - view-all
          - external-secrets-validator
        clusterRoles:
          - view-secrets-cms
          - view-routes

  clusterRoles:
    view-secrets-cms:
      rules:
      - apiGroups: [""]
        resources: ["secrets", "configmaps"]
        verbs: ["get", "list", "watch"]

    view-routes:
      rules:
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        verbs: ["get", "list", "watch"]

  roles:
    view-all:
      rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

    # RBAC for external secrets validation (namespace-scoped)
    external-secrets-validator:
      rules:
      - apiGroups: ["external-secrets.io"]
        resources: ["externalsecrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["authorization.k8s.io"]
        resources: ["selfsubjectrulesreviews"]
        verbs: ["create"]
