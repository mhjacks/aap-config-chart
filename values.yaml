---
secretStore:
  name: vault-backend
  kind: ClusterSecretStore

aapManifest:
  key: secret/data/hub/aap-manifest
  # When enabled: no ExternalSecret for aap-manifest; Vault CSI mounts the manifest instead.
  # Requires openshift-sscsi-vault dependency, global/clusterGroup values for the SPC, and Vault
  # Kubernetes auth bound to serviceAccountName in this namespace.
  csi:
    enabled: false
    mountPath: /pattern-home/aap-manifest
    objectName: b64content
    secretProviderClassName: aap-manifest-vault

agof:
  doAutoHubVaultConfig: true
  # When non-empty: ExternalSecret agof-vault-file + mount for agof overlay secrets.
  # Set to "" to skip Vault-backed agof vault file (init writes a minimal empty ~/agof_vault.yml).
  # Set to "secret/data/hub/agof-vault-file to use one if you need it
  vaultFileKey: ""
  automationHubTokenKey: secret/data/hub/automation-hub-token
  extraPlaybookOpts: ''

  agof_repo: https://github.com/validatedpatterns/agof.git
  agof_revision: v2
  # Optional: name of an existing Secret (same namespace) whose keys are mounted for
  # git in the agof-init container (clone agof_repo) and the agof-config container
  # (e.g. clone/fetch iac_repo during make). Use one of:
  # - .git-credentials: full git-credential-store line(s) for HTTPS
  # - ssh-privatekey (+ optional known_hosts): SSH private key (e.g. kubernetes.io/ssh-auth)
  # - HTTPS: username + (password or token), or token-only with gitAuthHttpsStyle below
  gitAuthSecret: ''
  # Optional Vault path: when set (with gitAuthSecret), an ExternalSecret is created that uses
  # dataFrom.extract to copy all fields from that Vault secret into the Kubernetes Secret named
  # gitAuthSecret (same pattern as vaultFileKey / agof-vault-file).
  gitAuthVaultKey: ''
  # When the Secret has only a "token" key: how to pick the HTTPS username (PAT / OAuth).
  # auto: from each repo URL host (github.com -> git; gitlab / gitea / forgejo / codeberg -> oauth2)
  # github|gitlab|gitea: force that platform's usual clone user (git / oauth2 / oauth2)
  gitAuthHttpsStyle: auto

  iac_repo: https://github.com/validatedpatterns-demos/ansible-edge-gitops-hmi-config-as-code.git
  iac_revision: main

configJob:
  image: quay.io/hybridcloudpatterns/imperative-container:v1
  schedule: "10 */2 * * *"
  activeDeadlineSeconds: 3600
  imagePullPolicy: Always
  configTimeout: 1800

serviceAccountName: aap-config-sa
serviceAccountNamespace: aap-config

# Single block for Vault CSI workload identity (SA, namespace, Vault Kubernetes auth role).
# When enabled, templates merge rbac.rolename + serviceAccount into openshift-sscsi-vault and
# drive workload pods' serviceAccountName from the same fields.
csiWorkloadIdentity:
  enabled: false
  serviceAccount: ""
  namespace: ""
  vaultAuthMount: hub
  appKey: aap-config
  # If set, used as the full Vault role name for SecretProviderClass (e.g. hub-sscsi-<sha1> when
  # rhvp.cluster_utils uses hash mode). If empty, role is {{ vaultAuthMount }}-sscsi-<stable slug>
  # matching vault_ss_csi_role_slug_mode: stable_slug in rhvp.cluster_utils.
  vaultKubernetesAuthRole: ""
  # Optional (non-empty only): tls.vaultSkipTLSVerify ("true"/"false"), vaultCACertPath, vaultTLSServerName
  # merged into openshift-sscsi-vault SPC. Omit vaultSkipTLSVerify here to inherit subchart + overrides.

# Used only when aapManifest.csi.enabled (openshift-sscsi-vault subchart). Same value shape as
# openshift-sscsi-vault-chart (ocpSecretsStoreCsiVault + clusterGroup for hub/spoke auth).
# clusterGroup here merges with the parent chart clusterGroup; applications maps are merged so
# pattern-level hashicorp-vault entries apply without duplicating them under this key.
openshift-sscsi-vault:
  clusterGroup:
    applications: {}
  ocpSecretsStoreCsiVault:
    secretProviderClass:
      installDefaultManifests: false
      enabled: true
      name: aap-manifest-vault
    rbac:
      rolename: hub-role
      serviceAccount:
        create: false
        name: aap-config-sa
        namespace: aap-config
    objects:
      - objectName: b64content
        secretPath: secret/data/hub/aap-manifest
        secretKey: b64content
    secretObjects: []
    vault:
      externalAddress: ""
      hubMountPath: hub
    # CA for Vault HTTPS (openshift-sscsi-vault-chart 0.0.15+): default emits a ConfigMap labeled for
    # CNO inject-trusted-cabundle (merged system + Proxy CA); SPC uses mountDir/trustedCabundleDataKey.
    # Mount the same configMapName on the Vault CSI DaemonSet (pattern vault extraValueFiles; see
    # aap-starter-kit overrides/values-vault-csi-tls-ca.yaml). GitOps PEM without injection: set
    # injectTrustedCabundle false and pemLiteral (or useLookup for cluster-side helm). Legacy Ansible
    # vault-tls-ca.pem only: injectTrustedCabundle false, createConfigMap false, keyInConfigMap aligned.
    caProvider:
      enabled: true
      syncProviderCaConfigMap:
        # -- Passed through to openshift-sscsi-vault: when true, TLS CA sync and SPC `vaultCACertPath` behavior apply.
        enabled: true
        # -- When true with createConfigMap true (default), emit CNO inject-trusted-cabundle ConfigMap; SPC uses trustedCabundleDataKey.
        injectTrustedCabundle: true
        # -- Key written by CNO after injection; used for vaultCACertPath when injectTrustedCabundle is true.
        trustedCabundleDataKey: ca-bundle.crt
        # -- Hub Vault route trust bundle (PEM). When set with injectTrustedCabundle false, render PEM ConfigMap (GitOps-safe).
        pemLiteral: ""
        # -- When true, subchart uses helm lookup() (needs API at render time; not for default Argo manifest generation).
        useLookup: false
        # -- When true (default), Helm emits the sync TLS ConfigMap (CNO injection or PEM from pemLiteral/useLookup).
        createConfigMap: true
        # -- Namespace for the TLS CA ConfigMap (typically `vault` where the provider pod runs).
        targetNamespace: vault
        # -- ConfigMap name; pattern `extraValueFiles` should mount this CM on the Vault CSI DaemonSet.
        configMapName: openshift-sscsi-vault-vault-tls-ca
        # -- Mount directory on the Vault CSI provider pod for the CA PEM.
        mountDir: /etc/pki/vault-ca
        # -- ConfigMap data key for PEM when not using CNO injection (legacy Ansible key).
        keyInConfigMap: vault-tls-ca.pem
        # -- Preset for lookup-based CA resolution only (`auto`, `ingressrouterca`, etc.).
        preset: auto
    # Align with openshift-sscsi-vault defaults: verify hub Vault HTTPS when the CA is available on the
    # Vault CSI provider (CNO bundle at mountDir/trustedCabundleDataKey, or mountDir/keyInConfigMap).
    # Set vaultSkipTLSVerify: "true" only for break-glass without a trust bundle on the provider.
    tls:
      vaultSkipTLSVerify: "false"
      vaultCACertPath: ""
      vaultTLSServerName: ""
global:
  hubClusterDomain: hub.example.com
  clusterDomain: foo.example.com
  localClusterDomain: ""
clusterGroup:
  applications: {}

# Validation job configuration
validationJob:
  disabled: false
  activeDeadlineSeconds: 3600

# RBAC configuration using vp-rbac subchart
vp-rbac:
  serviceAccounts:
    aap-config-sa:
      namespace: aap-config
      roleBindings:
        roles:
          - view-all
          - external-secrets-validator
        clusterRoles:
          - view-secrets-cms
          - view-routes

  clusterRoles:
    view-secrets-cms:
      rules:
      - apiGroups: [""]
        resources: ["secrets", "configmaps"]
        verbs: ["get", "list", "watch"]

    view-routes:
      rules:
      - apiGroups: ["route.openshift.io"]
        resources: ["routes"]
        verbs: ["get", "list", "watch"]

  roles:
    view-all:
      rules:
      - apiGroups: ["*"]
        resources: ["*"]
        verbs: ["get", "list", "watch"]

    # RBAC for external secrets validation (namespace-scoped)
    external-secrets-validator:
      rules:
      - apiGroups: ["external-secrets.io"]
        resources: ["externalsecrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: [""]
        resources: ["secrets"]
        verbs: ["get", "list", "watch"]
      - apiGroups: ["authorization.k8s.io"]
        resources: ["selfsubjectrulesreviews"]
        verbs: ["create"]
